name: check-pr-title

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          if [[ ! "$TITLE" =~ [A-Z]+-[0-9]+ ]]; then
            echo "❌ PR title must include a ticket ID (e.g. PROJ-123)"
            exit 1
          fi
